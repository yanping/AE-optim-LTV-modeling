# ==============================================================================
# Google Cloud AlphaEvolve LTV Forecasting Configuration
# ==============================================================================
# Single Source of Truth for the project. Manages GCP credentials,
# evolution hyperparameters, model mixture weights, dataset 3-way split,
# and parallel evaluation settings.
# ==============================================================================

# 1. Google Cloud & Gemini Enterprise Credentials and Service Settings
gcp:
  project_id: "<YOUR_GCP_PROJECT_ID>" # Enter your Google Cloud Project ID here (e.g., my-gcp-project-123)
  location: "global"
  collection: "default_collection"
  ge_app_id: "<YOUR_GE_APP_ID>" # Enter your Gemini Enterprise App/Engine ID here (e.g., gemini-enterprise-12345678)
  assistant: "default_assistant"
  base_url: "discoveryengine.googleapis.com"
  # Official alpha_evolve library path (can specify absolute or relative path)
  alpha_evolve_path: "./alpha_evolve"

# 2. Evolution Control & Hyperparameters
evolution:
  title: "Mobile Game LTV Feature Engineering Evolution"
  problem_description: "Evolve feature engineering transformations for 180-day mobile game LTV forecasting, maximizing Normalized Gini and Top-10% Revenue Recall using a fixed LightGBM Tweedie regression baseline."
  program_language: "python"
  max_programs_generated: 20       # Default maximum program generation budget (override with make run programs=N)
  max_programs_evaluated: 20       # Default maximum program evaluation budget (override with make run programs=N)
  concurrency: 4                   # Cloud generation concurrency
  worker_concurrency: 4            # Local parallel evaluation worker thread pool size
  parallel_evaluation: true        # Enable local parallel thread pool evaluation (LTV model fits in parallel on CPU)
  idle_timeout_s: 120              # Idle timeout while waiting for new program generation (seconds)
  primary_metric: "normalized_gini" # Primary metric for champion selection (supported: normalized_gini, top_10_recall, neg_rmse, spearman_corr)

# 3. Gemini Foundation Model Mixture Weights
models:
  - name: "gemini-3.5-flash"
    weight: 0.70
  - name: "gemini-3.1-pro-preview"
    weight: 0.30

# 4. Dataset 3-Way Partitioning (Full train_wide.csv split: 60% Train, 20% Eval, 20% Holdout)
dataset:
  raw_wide_path: "./data/train_wide.csv"
  train_split_path: "./data/train_split.csv"
  eval_split_path: "./data/eval_split.csv"
  holdout_split_path: "./data/holdout_split.csv"
  train_ratio: 0.60
  eval_ratio: 0.20
  holdout_ratio: 0.20
  random_state: 42
  split_method: "stratified"       # "stratified" (multi-factor stratified) or "oot" (out-of-time)

# 5. Artifacts Output Directory
artifacts:
  dir: "./artifacts"
